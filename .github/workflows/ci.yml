name: PPC-Gauge-Triad CI (Level 1 + 5-Target Cross-Compile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  level1-rust-and-python:
    name: Level 1 Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Level 1 tests (dev)
        run: cargo test --verbose

      - name: Run full Rust Level 1 suite incl. 1M-window L1.9 (release)
        run: cargo test --release -- --include-ignored

      - name: Build release cdylib
        run: cargo build --release

      - name: Verify #![no_std] release check
        run: cargo check --release --no-default-features

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python local verification suite (L1.8 parity + cache tests)
        run: |
          python -m unittest discover -s benchmarks -p "test_*.py" -v
          python benchmarks/run_benchmarks.py --l1-parity

  cross-compile-5-targets:
    name: 5-Target Cross-Compilation Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation linkers (aarch64 + mingw-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu mingw-w64

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            thumbv7em-none-eabihf
            aarch64-unknown-linux-gnu
            x86_64-pc-windows-gnu

      - name: "Target 1/5: Linux x86-64 cdylib (std)"
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: "Target 2/5: Linux x86-64 #![no_std]"
        run: cargo check --release --no-default-features --target x86_64-unknown-linux-gnu

      - name: "Target 3/5: ARM Cortex-M4F MCU (thumbv7em-none-eabihf, #![no_std])"
        run: cargo rustc --release --no-default-features --target thumbv7em-none-eabihf --lib --crate-type rlib

      - name: "Target 4/5: Linux ARM64 (aarch64-unknown-linux-gnu)"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: "Target 5/5: Windows x86-64 GNU (x86_64-pc-windows-gnu)"
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu
