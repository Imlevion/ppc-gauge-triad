[package]
name = "ppc_gauge_triad_rs"
version = "0.6.1"
edition = "2021"
description = "PPC-Gauge-Triad v0.6.1: #![no_std] f32 Zero-Heap Anomaly Engine with Huber-Clamped EMA, Stable-Plateau DC Re-Lock & Dual-Stage Alarm Gate"

[lib]
name = "ppc_gauge_triad_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
