[package]
name = "ppc_gauge_triad_rs"
version = "0.7.0"
edition = "2021"
rust-version = "1.75"
authors = ["Imlevion <imlevion@gmail.com>"]
description = "Deterministic #![no_std] f32 zero-heap streaming anomaly engine with Sim+(d) Givens-QR canonicalization, Huber-clamped EMA, and on-chip AutoCalBufF32 auto-warmup (<16 KB SRAM)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Imlevion/ppc-gauge-triad"
homepage = "https://github.com/Imlevion/ppc-gauge-triad"
documentation = "https://docs.rs/ppc_gauge_triad_rs"
readme = "README.md"
keywords = ["anomaly-detection", "no-std", "embedded", "streaming", "time-series"]
categories = ["no-std", "embedded", "algorithms", "science"]
exclude = [
    "data_cache/*",
    "firmware/*",
    "notebooks/*",
    "paper/*",
    "benchmarks/*",
    ".agents/*",
    ".github/*",
    "TUTORIAL_ANTIGRAVITY_APP_MCP.md",
    "LAUNCH_KIT.md",
]

[lib]
name = "ppc_gauge_triad_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
# Opt-in minimal `loop {}` #[panic_handler] ONLY for standalone `#![no_std]` cdylib builds.
# Keep DISABLED when depending on `ppc_gauge_triad_rs` as a Rust library inside embedded firmware
# (the final firmware binary must supply its own #[panic_handler], e.g. `panic-halt` or `panic-probe`).
panic-handler = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(all(windows, target_env = "gnu"))'.dev-dependencies]
# Self-contained rustup x86_64-pc-windows-gnu lacks external dlltool.exe in PATH required by windows-sys >=0.60 raw-dylib
winapi-util = ">=0.1.6, <=0.1.9"
is-terminal = ">=0.4.12, <=0.4.16"

[[bench]]
name = "triad_bench"
harness = false
required-features = ["std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
